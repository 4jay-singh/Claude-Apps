<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Workout Log</title>
<style>
  :root {
    --bg: #f4f4f6;
    --card: #ffffff;
    --text: #111114;
    --muted: #6b6b75;
    --line: #e4e4ea;
    --accent: #ff5a1f;
    --accent-text: #ffffff;
    --danger: #e5383b;
    --input: #f0f0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111114;
      --card: #1c1c21;
      --text: #f4f4f6;
      --muted: #9a9aa5;
      --line: #2c2c33;
      --input: #26262c;
      --accent: #ff6a33;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
  header h1 { margin: 0; font-size: 28px; font-weight: 750; letter-spacing: -0.02em; }
  .daynav { display: flex; align-items: center; gap: 4px; }
  .iconbtn {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); font-size: 18px;
  }
  .iconbtn:disabled { opacity: .35; }
  .datelabel { color: var(--muted); font-size: 15px; margin: -4px 0 14px; }
  .todaylink { color: var(--accent); font-weight: 600; margin-left: 6px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }

  form .row { display: flex; gap: 10px; }
  label.f { display: block; flex: 1; min-width: 0; }
  label.f span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 4px 2px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid transparent;
    background: var(--input); font-size: 17px; outline: none; -webkit-appearance: none; appearance: none;
  }
  input:focus { border-color: var(--accent); }
  .mb { margin-bottom: 10px; }
  .primary {
    width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--accent-text);
    font-weight: 700; font-size: 17px; margin-top: 12px;
  }
  .primary:active { transform: scale(.99); opacity: .9; }

  .summary { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); font-size: 12px; }

  .ex h2 { margin: 0; font-size: 18px; }
  .exhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .exmeta { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .set {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 10px 2px; border-top: 1px solid var(--line);
  }
  .set:first-of-type { border-top: 0; }
  .setno {
    width: 26px; height: 26px; border-radius: 50%; background: var(--input); display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: var(--muted); flex: none;
  }
  .setmain { flex: 1; font-variant-numeric: tabular-nums; }
  .setmain b { font-size: 17px; }
  .settime { color: var(--muted); font-size: 12px; }
  .addset { color: var(--accent); font-weight: 600; font-size: 15px; padding: 8px 2px 0; }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  .day { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; padding: 12px 2px; border-top: 1px solid var(--line); }
  .day:first-child { border-top: 0; }
  .day .d { font-weight: 650; }
  .day .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chev { color: var(--muted); font-size: 20px; }

  .ghost { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; margin-top: 8px; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
    background: color-mix(in srgb, var(--card) 88%, transparent);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button { flex: 1; max-width: 200px; padding: 10px 0 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
  nav.tabs button .i { display: block; font-size: 22px; line-height: 1.1; }
  nav.tabs button.on { color: var(--accent); }

  dialog {
    border: 0; padding: 0; border-radius: 18px; width: min(92vw, 420px);
    background: var(--card); color: var(--text);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .in { padding: 18px; }
  dialog h3 { margin: 0 0 12px; }
  dialog .btns { display: flex; gap: 10px; margin-top: 14px; }
  dialog .btns button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 650; background: var(--input); }
  dialog .btns .save { background: var(--accent); color: var(--accent-text); }
  dialog .del { color: var(--danger); width: 100%; padding: 12px; margin-top: 8px; font-weight: 650; }

  .toast {
    position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOG VIEW -->
  <section id="logView">
    <header>
      <h1 id="dayTitle">Today</h1>
      <div class="daynav">
        <button class="iconbtn" id="prevDay" aria-label="Previous day">‹</button>
        <button class="iconbtn" id="nextDay" aria-label="Next day">›</button>
      </div>
    </header>
    <div class="datelabel"><span id="dateLabel"></span><button class="todaylink" id="goToday" hidden>Go to today</button></div>

    <form class="card" id="addForm" autocomplete="off">
      <label class="f mb"><span>Exercise</span>
        <input type="text" id="exInput" list="exList" placeholder="e.g. Bench press" required autocapitalize="words">
      </label>
      <datalist id="exList"></datalist>
      <div class="row">
        <label class="f"><span>Reps</span>
          <input type="number" id="repsInput" inputmode="numeric" min="1" step="1" placeholder="10" required>
        </label>
        <label class="f"><span>Weight (kg)</span>
          <input type="number" id="kgInput" inputmode="decimal" min="0" step="any" placeholder="optional">
        </label>
      </div>
      <button class="primary" type="submit">Add set</button>
    </form>

    <div class="summary" id="summary" hidden>
      <div class="stat"><b id="sumEx">0</b><small>Exercises</small></div>
      <div class="stat"><b id="sumSets">0</b><small>Sets</small></div>
      <div class="stat"><b id="sumReps">0</b><small>Reps</small></div>
      <div class="stat"><b id="sumVol">0</b><small>Volume kg</small></div>
    </div>

    <div id="dayList"></div>
  </section>

  <!-- HISTORY VIEW -->
  <section id="historyView" hidden>
    <header><h1>History</h1></header>
    <div class="card" id="historyList"></div>
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:17px">Backup</h2>
      <p class="note" style="margin-top:0">Your data is stored only on this phone. Export a backup now and then. Deleting the app from your Home Screen also deletes its data.</p>
      <button class="ghost" id="exportBtn">Export backup (.json)</button>
      <button class="ghost" id="importBtn">Import backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>

</div>

<nav class="tabs">
  <button id="tabLog" class="on"><span class="i">＋</span>Log</button>
  <button id="tabHistory"><span class="i">☰</span>History</button>
</nav>

<dialog id="editDlg">
  <form class="in" method="dialog" id="editForm">
    <h3 id="editTitle">Edit set</h3>
    <label class="f mb"><span>Exercise</span><input type="text" id="editEx" list="exList" required></label>
    <div class="row">
      <label class="f"><span>Reps</span><input type="number" id="editReps" inputmode="numeric" min="1" step="1" required></label>
      <label class="f"><span>Weight (kg)</span><input type="number" id="editKg" inputmode="decimal" min="0" step="any" placeholder="none"></label>
    </div>
    <div class="btns">
      <button type="button" id="editCancel">Cancel</button>
      <button type="submit" class="save">Save</button>
    </div>
    <button type="button" class="del" id="editDelete">Delete set</button>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  const STORE_KEY = 'workoutLog.v1';
  const PREFS_KEY = 'workoutLog.prefs.v1';
  const $ = id => document.getElementById(id);

  // ---------- storage ----------
  // data shape: { "YYYY-MM-DD": [ { id, exercise, reps, kg|null, ts } ] }
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
    catch { toast('Could not save. Is storage full?'); }
  }
  function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {} }

  let data = load(STORE_KEY, {});
  let prefs = load(PREFS_KEY, { lastKg: {} });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // ---------- dates ----------
  const keyOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const dateOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => keyOf(new Date());
  const shift = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
  function niceDay(k) {
    const t = todayKey();
    if (k === t) return 'Today';
    if (k === shift(t, -1)) return 'Yesterday';
    return dateOf(k).toLocaleDateString(undefined, { weekday: 'long' });
  }
  const longDate = k => dateOf(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

  let current = todayKey();

  // ---------- helpers ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtKg = n => (Math.round(n * 100) / 100).toLocaleString(undefined, { maximumFractionDigits: 2 });
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const normName = s => s.trim().replace(/\s+/g, ' ');

  function allExerciseNames() {
    const seen = new Map();
    Object.keys(data).sort().forEach(k => data[k].forEach(s => seen.set(s.exercise.toLowerCase(), s.exercise)));
    return [...seen.values()].sort((a, b) => a.localeCompare(b));
  }
  // reuse the existing capitalisation of an exercise if the user typed it differently
  function canonicalName(name) {
    const n = normName(name);
    const found = allExerciseNames().find(e => e.toLowerCase() === n.toLowerCase());
    return found || n;
  }

  function groupSets(sets) {
    const groups = new Map();
    sets.forEach(s => {
      const k = s.exercise.toLowerCase();
      if (!groups.has(k)) groups.set(k, { name: s.exercise, sets: [] });
      groups.get(k).sets.push(s);
    });
    return [...groups.values()];
  }
  function stats(sets) {
    let reps = 0, vol = 0;
    sets.forEach(s => { reps += s.reps; if (s.kg) vol += s.reps * s.kg; });
    return { reps, vol, sets: sets.length, ex: groupSets(sets).length };
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- render: log ----------
  function renderLog() {
    const isToday = current === todayKey();
    $('dayTitle').textContent = niceDay(current);
    $('dateLabel').textContent = longDate(current);
    $('goToday').hidden = isToday;
    $('nextDay').disabled = isToday;

    $('exList').innerHTML = allExerciseNames().map(n => `<option value="${esc(n)}">`).join('');

    const sets = (data[current] || []).slice().sort((a, b) => a.ts - b.ts);
    const st = stats(sets);
    $('summary').hidden = sets.length === 0;
    $('sumEx').textContent = st.ex;
    $('sumSets').textContent = st.sets;
    $('sumReps').textContent = st.reps;
    $('sumVol').textContent = fmtKg(st.vol);

    if (!sets.length) {
      $('dayList').innerHTML = `<div class="empty">No sets logged ${isToday ? 'yet today' : 'on this day'}.<br>Add your first set above.</div>`;
      return;
    }
    $('dayList').innerHTML = groupSets(sets).map(g => {
      const gs = stats(g.sets);
      const meta = `${gs.sets} set${gs.sets > 1 ? 's' : ''} · ${gs.reps} reps${gs.vol ? ` · ${fmtKg(gs.vol)} kg` : ''}`;
      const rows = g.sets.map((s, i) => `
        <button class="set" data-id="${s.id}">
          <span class="setno">${i + 1}</span>
          <span class="setmain"><b>${s.reps}</b> reps${s.kg != null ? ` × <b>${fmtKg(s.kg)}</b> kg` : ''}</span>
          <span class="settime">${new Date(s.ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}</span>
        </button>`).join('');
      return `<div class="card ex">
        <div class="exhead"><h2>${esc(g.name)}</h2><span class="exmeta">${meta}</span></div>
        ${rows}
        <button class="addset" data-repeat="${esc(g.name)}">＋ Repeat last set</button>
      </div>`;
    }).join('');
  }

  // ---------- render: history ----------
  function renderHistory() {
    const days = Object.keys(data).filter(k => data[k].length).sort().reverse();
    if (!days.length) {
      $('historyList').innerHTML = '<div class="empty">No workouts yet.</div>';
      return;
    }
    $('historyList').innerHTML = days.map(k => {
      const st = stats(data[k]);
      const names = groupSets(data[k]).map(g => g.name);
      const shown = names.slice(0, 3).join(', ') + (names.length > 3 ? ` +${names.length - 3}` : '');
      return `<button class="day" data-day="${k}">
        <div><div class="d">${esc(longDate(k))}</div>
        <div class="s">${esc(shown)}</div>
        <div class="s">${st.sets} set${st.sets === 1 ? '' : 's'} · ${st.reps} reps${st.vol ? ` · ${fmtKg(st.vol)} kg` : ''}</div></div>
        <span class="chev">›</span></button>`;
    }).join('');
  }

  // ---------- tabs ----------
  function show(tab) {
    $('logView').hidden = tab !== 'log';
    $('historyView').hidden = tab !== 'history';
    $('tabLog').classList.toggle('on', tab === 'log');
    $('tabHistory').classList.toggle('on', tab === 'history');
    if (tab === 'log') renderLog(); else renderHistory();
    window.scrollTo(0, 0);
  }
  $('tabLog').onclick = () => show('log');
  $('tabHistory').onclick = () => show('history');

  // ---------- day nav ----------
  $('prevDay').onclick = () => { current = shift(current, -1); renderLog(); };
  $('nextDay').onclick = () => { if (current < todayKey()) { current = shift(current, 1); renderLog(); } };
  $('goToday').onclick = () => { current = todayKey(); renderLog(); };
  $('historyList').onclick = e => {
    const b = e.target.closest('[data-day]'); if (!b) return;
    current = b.dataset.day; show('log');
  };

  // ---------- add set ----------
  function addSet(exercise, reps, kg) {
    (data[current] = data[current] || []).push({ id: uid(), exercise, reps, kg, ts: Date.now() });
    if (kg != null) prefs.lastKg[exercise.toLowerCase()] = kg;
    save(); savePrefs(); renderLog();
  }
  function parseKg(v) {
    if (v === '' || v == null) return null;
    const n = parseFloat(String(v).replace(',', '.'));
    return isFinite(n) && n >= 0 ? n : null;
  }

  $('exInput').addEventListener('change', () => {
    // prefill the last weight used for this exercise
    const last = prefs.lastKg[canonicalName($('exInput').value).toLowerCase()];
    if (last != null && $('kgInput').value === '') $('kgInput').value = last;
  });

  $('addForm').onsubmit = e => {
    e.preventDefault();
    const name = canonicalName($('exInput').value);
    const reps = parseInt($('repsInput').value, 10);
    if (!name || !(reps > 0)) return;
    addSet(name, reps, parseKg($('kgInput').value));
    toast(`Added: ${name}, ${reps} reps`);
    // keep exercise + weight so the next set is one tap; clear reps
    $('repsInput').value = '';
    $('repsInput').focus();
  };

  $('dayList').onclick = e => {
    const rep = e.target.closest('[data-repeat]');
    if (rep) {
      const sets = data[current].filter(s => s.exercise === rep.dataset.repeat).sort((a, b) => a.ts - b.ts);
      const last = sets[sets.length - 1];
      addSet(last.exercise, last.reps, last.kg);
      toast('Set added');
      return;
    }
    const row = e.target.closest('[data-id]');
    if (row) openEdit(row.dataset.id);
  };

  // ---------- edit / delete ----------
  let editing = null;
  function openEdit(id) {
    const s = (data[current] || []).find(x => x.id === id); if (!s) return;
    editing = s;
    $('editEx').value = s.exercise;
    $('editReps').value = s.reps;
    $('editKg').value = s.kg ?? '';
    $('editDlg').showModal();
  }
  $('editCancel').onclick = () => $('editDlg').close();
  $('editForm').onsubmit = e => {
    e.preventDefault();
    const reps = parseInt($('editReps').value, 10);
    const name = canonicalName($('editEx').value);
    if (!editing || !name || !(reps > 0)) return;
    editing.exercise = name; editing.reps = reps; editing.kg = parseKg($('editKg').value);
    save(); $('editDlg').close(); renderLog(); toast('Set updated');
  };
  $('editDelete').onclick = () => {
    if (!editing || !confirm('Delete this set?')) return;
    data[current] = data[current].filter(x => x.id !== editing.id);
    if (!data[current].length) delete data[current];
    save(); $('editDlg').close(); renderLog(); toast('Set deleted');
  };

  // ---------- backup ----------
  $('exportBtn').onclick = async () => {
    const json = JSON.stringify({ app: 'workout-log', version: 1, exported: new Date().toISOString(), data }, null, 2);
    const name = `workouts-${todayKey()}.json`;
    const file = new File([json], name, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        return;
      }
    } catch (err) { if (err.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async () => {
    const f = $('importFile').files[0]; $('importFile').value = '';
    if (!f) return;
    try {
      const parsed = JSON.parse(await f.text());
      const incoming = parsed.data || parsed;
      if (typeof incoming !== 'object' || Array.isArray(incoming)) throw new Error();
      let added = 0;
      for (const [k, sets] of Object.entries(incoming)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(sets)) continue;
        const existing = data[k] = data[k] || [];
        const ids = new Set(existing.map(s => s.id));
        sets.forEach(s => {
          if (!s || !s.exercise || !(s.reps > 0) || ids.has(s.id)) return;
          existing.push({ id: s.id || uid(), exercise: String(s.exercise), reps: +s.reps, kg: s.kg == null ? null : +s.kg, ts: +s.ts || dateOf(k).getTime() });
          added++;
        });
        if (!existing.length) delete data[k];
      }
      save(); renderHistory(); toast(`Imported ${added} set${added === 1 ? '' : 's'}`);
    } catch { toast('That file is not a valid backup'); }
  };

  // roll over to the new day if the app is left open past midnight
  let lastToday = todayKey();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const t = todayKey();
    if (t !== lastToday) { if (current === lastToday) current = t; lastToday = t; }
    if (!$('logView').hidden) renderLog();
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  renderLog();
})();
</script>
</body>
</html>
